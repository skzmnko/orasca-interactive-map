<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endorath Interactive Map</title>

    <link rel="preload" href="css/vendor/leaflet.css" as="style">
    <link rel="preload" href="css/style.css" as="style">

    <link rel="stylesheet" href="css/vendor/leaflet.css">
    <link rel="stylesheet" href="css/style.css">

    <link rel="icon" href="data:,">
</head>
<body>
    
    <div class="map-background"></div>
    
    <div id="map"></div>

    <div class="mobile-top-panel" id="mobile-top-panel">
        <div class="mobile-panel-title">World of Orasca</div>
        <div class="mobile-panel-actions">
            <button id="mobile-filter-btn" class="mobile-filter-btn" title="Open filter panel">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="22 3 2 3 10 13 10 21 14 18 14 13 22 3"/>
                </svg>
            </button>
            <button id="mobile-search-btn" class="mobile-search-btn" title="Search">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="mobile-search-panel" id="mobile-search-panel">
        <div class="mobile-search-container">
            <input type="text" id="mobile-search" placeholder="Search locations...">
        </div>
        <div id="mobile-search-results" class="mobile-search-results"></div>
    </div>

    <button id="panel-open-btn" class="panel-open-btn hidden" title="Open control panel">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 13 10 21 14 18 14 13 22 3"/>
        </svg>
    </button>

    <div class="control-panel-container" id="control-panel-container">
        <div id="control-panel">
            <div class="panel-header" id="panel-header">
                <h3>World of Orasca Interactive Map</h3>
                <button id="panel-close-btn" class="panel-close-btn" title="Close panel">✕</button>
            </div>
            
            <div class="search-section desktop-search" id="desktop-search">
                <input type="text" id="search" placeholder="Search...">
                <div id="search-results"></div>
            </div>

            <div class="all-layers-control">
                <span id="show-all-layers" class="layer-toggle-btn">SHOW ALL</span>
                <span id="hide-all-layers" class="layer-toggle-btn">HIDE ALL</span>
            </div>

            <div class="layers-section">
                <h4>LOCATIONS</h4>
                <div class="layer-control">
                    <input type="checkbox" id="cities-layer" checked> 
                    <label for="cities-layer"><img src="images/icons/cities.png" class="legend-icon" alt="Cities"> Cities</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="settlements-layer" checked> 
                    <label for="settlements-layer"><img src="images/icons/settlements.png" class="legend-icon" alt="Settlements"> Settlements</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="forts-layer" checked> 
                    <label for="forts-layer"><img src="images/icons/forts.png" class="legend-icon" alt="Forts"> Forts</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="feyspires-layer" checked> 
                    <label for="feyspires-layer"><img src="images/icons/forts.png" class="legend-icon" alt="Feyspires"> Feyspires</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="shrines-layer" checked> 
                    <label for="shrines-layer"><img src="images/icons/shrines.png" class="legend-icon" alt="Shrines"> Shrines</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="ruins-layer" checked> 
                    <label for="ruins-layer"><img src="images/icons/ruins.png" class="legend-icon" alt="Ruins"> Ruins</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="dungeons-layer" checked> 
                    <label for="dungeons-layer"><img src="images/icons/dungeons.png" class="legend-icon" alt="Dungeons"> Dungeons</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="poi-layer" checked> 
                    <label for="poi-layer"><img src="images/icons/poi.png" class="legend-icon" alt="Points of interest"> Points of interest</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="secrets-layer" checked> 
                    <label for="secrets-layer"><img src="images/icons/secrets.png" class="legend-icon" alt="Secrets"> Secrets</label>
                </div>

                <div class="map-controls">
                    <button id="reset-view">RESET VIEW</button>
                </div>
            </div>
        </div>
    </div>

    <div id="dm-tools-panel-container"></div>

    <script src="js/vendor/leaflet.js" defer></script>
    <script type="module" src="js/main.js" defer></script>

</body>
</html>
