<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endorath Interactive Map</title>

    <!-- Preload критических ресурсов -->
    <link rel="preload" href="css/vendor/leaflet.css" as="style">
    <link rel="preload" href="css/style.css" as="style">

    <!-- CSS -->
    <link rel="stylesheet" href="css/vendor/leaflet.css">
    <link rel="stylesheet" href="css/style.css">

    <link rel="icon" href="data:,">
</head>
<body>
    
    <!-- Background Container - ИЗМЕНЕНО: убран фоновый рисунок -->
    <div class="map-background"></div>
    
    <div id="map"></div>

    <!-- Контейнер для панели и кнопки -->
    <div class="control-panel-container">
        <div id="control-panel">
            <!-- Заголовок -->
            <div class="panel-header">
                <h3>Fading World Interactive Map</h3>
            </div>
            
            <div class="search-section">
                <input type="text" id="search" placeholder="Поиск локаций...">
                <div id="search-results"></div>
            </div>

            <div class="all-layers-control">
                <span id="show-all-layers" class="layer-toggle-btn">Показать все</span>
                <span id="hide-all-layers" class="layer-toggle-btn">Скрыть все</span>
            </div>

            <div class="layers-section">
                <h4>ЛОКАЦИИ</h4>
                <div class="layer-control">
                    <input type="checkbox" id="cities-layer" checked> 
                    <label for="cities-layer"><img src="images/icons/towns.png" class="legend-icon" alt="Cities"> Города</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="settlements-layer" checked> 
                    <label for="settlements-layer"><img src="images/icons/settlements.png" class="legend-icon" alt="Settlements"> Поселения</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="ruins-layer" checked> 
                    <label for="ruins-layer"><img src="images/icons/tower_ruins.png" class="legend-icon" alt="Ruins"> Руины</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="inns-layer" checked> 
                    <label for="inns-layer"><img src="images/icons/inns.png" class="legend-icon" alt="Inns"> Таверны</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="dungeons-layer" checked> 
                    <label for="dungeons-layer"><img src="images/icons/dungeons.png" class="legend-icon" alt="Dungeons"> Подземелья</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="forts-layer" checked> 
                    <label for="forts-layer"><img src="images/icons/forts.png" class="legend-icon" alt="Fortresses"> Крепости</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="temples-layer" checked> 
                    <label for="temples-layer"><img src="images/icons/temples.png" class="legend-icon" alt="Temples"> Храмы</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="landmarks-layer" checked> 
                    <label for="landmarks-layer"><img src="images/icons/landmarks.png" class="legend-icon" alt="Landmarks"> Другие места</label>
                </div>
                
                <!-- Разделительная линия между типами локаций -->
                <div class="layer-divider"></div>
                
                <div class="layer-control">
                    <input type="checkbox" id="forests-layer"> 
                    <label for="forests-layer"><img src="images/icons/forests.png" class="legend-icon" alt="Forests"> Леса</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="mountains-layer"> 
                    <label for="mountains-layer"><img src="images/icons/mountains.png" class="legend-icon" alt="Mountains"> Горы</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="rivers-layer"> 
                    <label for="rivers-layer"><img src="images/icons/rivers.png" class="legend-icon" alt="Rivers and lakes"> Реки и озера</label>
                </div>
                <div class="layer-control">
                    <input type="checkbox" id="seas-layer"> 
                    <label for="seas-layer"><img src="images/icons/seas.png" class="legend-icon" alt="Seas"> Моря</label>
                </div>
            </div>

            <div class="map-controls">
                <button id="reset-view">Сбросить вид</button>
            </div>
        </div>

        <!-- Кнопка переключения панели (теперь ВНЕ панели) -->
        <div id="panel-toggle" class="panel-toggle-btn" title="Скрыть панель"></div>
    </div>

    <!-- Скрипты -->
    <script src="js/vendor/leaflet.js" defer></script>
    <script type="module" src="js/main.js" defer></script>

</body>
</html>
